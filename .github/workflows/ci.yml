name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q main.py build_exe.py chat_exporter
      # 必须用 pytest：仓库里既有 unittest.TestCase 也有 pytest 函数式用例，
      # `unittest discover` 只能发现前者（117 个里只跑到 80 个）。
      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    name: Build Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatExporter-windows
          path: dist/ChatExporter.exe
          if-no-files-found: error
